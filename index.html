<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Manager Pro</title>
<style>
:root{--navy:#0b2545;--navy2:#13315c;--sky:#9db4d6;--bg:#f3f5f8;--card:#fff;--line:#dde3ec;--txt:#1b2733;--mut:#6b7a8d;--ok:#1f8a5b;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;z-index:5}
body.auth header{display:none}
header b{font-size:18px;flex:1}header b span{color:var(--sky);font-weight:500}
#who{font-size:12px;color:#c5d3e8;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 16px;font-size:15px;cursor:pointer;font-weight:600}
header button{background:#fff2;padding:7px 10px;font-size:13px}
button.alt{background:#e8edf5;color:var(--navy)}button.danger{background:var(--bad)}button:disabled{opacity:.5}
main{max-width:980px;margin:0 auto;padding:16px}body.auth main{max-width:none;padding:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin-top:4px;background:#fff}
input:focus,select:focus{outline:2px solid var(--sky);border-color:var(--navy2)}
nav{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto}nav button{background:#e8edf5;color:var(--navy);white-space:nowrap}nav button.on{background:var(--navy);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--mut);display:block;font-size:12px}.kpi b{font-size:24px;color:var(--navy)}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:8px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut)}.bars i{display:block;background:var(--navy2);border-radius:4px 4px 0 0;min-height:2px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.tag{background:#e8edf5;color:var(--navy);border-radius:20px;padding:2px 9px;font-size:12px}.tag.ok{background:#dff3e9;color:var(--ok)}
h3{margin:0 0 8px;color:var(--navy)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ok);color:#fff;padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;z-index:99}
#toast.show{opacity:1}#toast.bad{background:var(--bad)}
/* écran d’accueil */
.authwrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.brand{background:linear-gradient(150deg,#06142b,var(--navy2));color:#fff;padding:48px 40px;display:flex;flex-direction:column;justify-content:center}
.logo{width:54px;height:54px;border-radius:14px;background:#fff;color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:22px;margin-bottom:18px}
.brand h1{margin:0 0 10px;font-size:32px}.brand h1 span{color:var(--sky);font-weight:500}.brand p{color:#c5d3e8;font-size:17px;max-width:380px}
.brand ul{padding:0;list-style:none;margin-top:22px}.brand li{margin:10px 0;color:#dbe6f6}.brand li:before{content:"✓";color:var(--sky);margin-right:10px;font-weight:700}
.formside{display:flex;align-items:center;justify-content:center;padding:24px}
.formcard{width:100%;max-width:420px}
.tabs{display:flex;gap:6px;margin-bottom:8px;background:#e8edf5;border-radius:12px;padding:4px}
.tabs button{flex:1;background:transparent;color:var(--navy);padding:9px 6px;font-size:13px}.tabs button.on{background:#fff;box-shadow:0 1px 4px #0002}
@media(max-width:760px){.authwrap{grid-template-columns:1fr}.brand{padding:28px 24px}.brand h1{font-size:24px}.brand ul{display:none}}
/* introduction animée */
#intro{position:fixed;inset:0;z-index:90;background:#06142b;overflow:hidden;transition:opacity .7s}
#intro.gone{opacity:0;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(135deg,#0b2545,#13315c);z-index:3;transition:transform 1.5s cubic-bezier(.77,0,.18,1) .7s}
.door.l{left:0;border-right:1px solid #9db4d6}.door.r{right:0;transform:none}
#intro.open .door.l{transform:translateX(-101%)}#intro.open .door.r{transform:translateX(101%)}
.light{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#1d4e89 0,#0b2545 40%,#06142b 75%);animation:pulse 5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.15)}}
.stage{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.word{font-size:clamp(38px,11vw,88px);font-weight:300;letter-spacing:.18em;margin:0;padding-left:.18em}
.word span{display:inline-block;opacity:0;transform:translateY(30px) scale(.9);filter:blur(8px)}
#intro.open .word span{animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(1.6s + var(--i)*.1s)}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.line{height:2px;width:0;background:linear-gradient(90deg,transparent,var(--sky),transparent);margin:18px 0}
#intro.open .line{animation:grow 1.2s ease forwards 2.6s}@keyframes grow{to{width:min(320px,70vw)}}
.sub{opacity:0;color:#c5d3e8;letter-spacing:.12em;font-size:14px;text-transform:uppercase}
#intro.open .sub{animation:fade 1s forwards 3s}
.enter{opacity:0;margin-top:34px;background:#fff;color:var(--navy);padding:13px 34px;border-radius:30px;letter-spacing:.08em}
#intro.open .enter{animation:fade 1s forwards 3.5s}@keyframes fade{to{opacity:1}}
.skip{position:absolute;top:16px;right:16px;z-index:5;background:#fff1;font-size:13px;padding:7px 12px;border:1px solid #fff3}
@media(prefers-reduced-motion:reduce){.door,.light,.word span,.line,.sub,.enter{animation:none!important;transition:none!important;opacity:1!important;transform:none!important;filter:none!important}.door{display:none}.line{width:200px}}
/* profil employé */
.avatar{width:64px;height:64px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
.prof{display:flex;gap:16px;align-items:center}.prof h3{margin:0}.prof p{margin:2px 0;color:var(--mut);font-size:14px}
.code{font-size:26px;letter-spacing:.2em;font-weight:800;color:var(--navy);background:#e8edf5;padding:8px 14px;border-radius:10px;display:inline-block}
body.hrapp header{display:none}body.hrapp main{max-width:none;padding:0}
.lay{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
#sb{background:#fff;border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.sbl{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;color:var(--navy);font-size:17px}.sbl span{color:var(--navy2);font-weight:500}
.logo.sm{width:36px;height:36px;font-size:15px;margin:0;background:var(--navy);color:#fff;border-radius:10px}
.sbn{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.sbn button{background:transparent;color:#41536b;text-align:left;display:flex;align-items:center;gap:10px;padding:10px 12px;font-weight:500;border-radius:10px}
.sbn button.on{background:#e7efff;color:var(--navy2);font-weight:700}.sbn button:hover{background:#f0f4fa}
.sbn em{margin-left:auto;font-style:normal;font-size:10px;background:#eef1f6;color:var(--mut);padding:2px 7px;border-radius:10px}
.plan{background:linear-gradient(135deg,var(--navy),#1c4f94);color:#fff;border-radius:14px;padding:14px;margin:10px 0;font-size:13px}.plan:empty{display:none}.plan b{display:block;font-size:15px}.plan button{width:100%;margin-top:10px;background:#fff;color:var(--navy);padding:8px}
.lo{background:#e8edf5;color:var(--navy)}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4}
.top h2{margin:0;flex:1;font-size:20px;color:var(--navy)}.bg{display:none;padding:8px 12px}
.uc{display:flex;align-items:center;gap:10px}.uc small{display:block;color:var(--mut);font-size:12px}.avatar.s{width:38px;height:38px;font-size:14px}
.pad{padding:22px;max-width:1100px}.scrim{display:none}
.kp{display:flex;gap:12px;align-items:center}.ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:14px}.qa button{width:100%;margin-bottom:10px;background:#eef3fb;color:var(--navy2);text-align:left}
@media(max-width:860px){.lay{grid-template-columns:1fr}#sb{position:fixed;z-index:30;left:0;top:0;width:262px;transform:translateX(-105%);transition:.25s}.lay.open #sb{transform:none}.lay.open .scrim{display:block;position:fixed;inset:0;background:#0007;z-index:20}.bg{display:block}.uc div:last-child{display:none}.pad{padding:14px}.two{grid-template-columns:1fr}}
.tag.warn{background:#fdeee0;color:#b9640c}.tag.bad{background:#fde6e6;color:var(--bad)}td button{padding:6px 10px;font-size:13px}.link{color:var(--navy2);text-align:center;cursor:pointer;text-decoration:underline;margin:14px 0 0}td select{padding:6px;font-size:13px;margin:0}</style>
</head>
<body class="auth">
<div id="intro"><button class="skip" id="skip">Passer</button><div class="light"></div><div class="door l"></div><div class="door r"></div>
<div class="stage"><h2 class="word" id="word"></h2><div class="line"></div><div class="sub">HR Manager Pro · La gestion RH, simplifiée</div><button class="enter" id="enter">ENTRER</button></div></div>
<header><b>HR Manager <span>Pro</span></b><div id="who"></div><button id="pwb" hidden>Mot de passe</button><button id="out" hidden>Déconnexion</button></header>
<main id="app"></main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient('https://egxoglirjqnzkullsrez.supabase.co','sb_publishable_XnzmsUCYgpPclGJlQMYPJg_XjYFlEYh');
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => new Intl.NumberFormat('fr-FR').format(n ?? 0);
const SUB = {trial:'Essai',active:'Actif',expired:'Expiré',suspended:'Suspendu',past_due:'Impayé',cancelled:'Annulé'};
const ST = {active:'Actif',on_leave:'En congé',terminated:'Parti'};
const AT = {present:'Présent',late:'Retard',absent:'Absent',half_day:'Demi-journée',leave:'Congé'};
const hhmm = t => t ? new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '—';
let me = null, mode = 'login', tab = 'dash', inRecovery = false;

const setApp = h => $('#app').innerHTML = h;
function toast(m, bad){ const t = $('#toast'); t.textContent = m; t.className = bad ? 'bad show' : 'show'; setTimeout(() => t.className = '', 5000); }
const fail = e => toast(e?.message || 'Une erreur est survenue', true);
const hr = () => me && ['company_admin','hr'].includes(me.role);

/* ---------- introduction ---------- */
function intro(){
  const w = $('#word'); w.innerHTML = [...'WELCOME'].map((c,i) => `<span style="--i:${i}">${c}</span>`).join('');
  setTimeout(() => $('#intro').classList.add('open'), 300);
  const close = () => { $('#intro').classList.add('gone'); try{sessionStorage.introSeen = 1}catch(e){} setTimeout(() => $('#intro').remove(), 800); };
  $('#enter').onclick = close; $('#skip').onclick = close;
}
function noIntro(){ $('#intro').remove(); }

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if (inRecovery || /type=recovery/.test(location.hash)) { inRecovery = true; noIntro(); return recoveryView(); }
  let seen = false; try{ seen = !!sessionStorage.introSeen }catch(e){}
  session || seen ? noIntro() : intro();
  session ? loadMe() : authView();
}
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') { me = null; authView(); } if (ev === 'PASSWORD_RECOVERY') { inRecovery = true; recoveryView(); } });
$('#out').onclick = () => sb.auth.signOut();
$('#pwb').onclick = () => { setApp('<div><button class="alt" id="bkp" style="margin-bottom:12px">← Retour</button><div id="v"></div></div>'); pwForm($('#v')); $('#bkp').onclick = () => loadMe(); };

/* ---------- connexion / inscription ---------- */
function authView(){
  document.body.className = 'auth'; $('#out').hidden = true; $('#pwb').hidden = true; $('#who').textContent = '';
  const su = mode === 'signup', jn = mode === 'join';
  const tabs = [['login','Connexion'],['signup','Créer une entreprise'],['join','Rejoindre']];
  setApp(`<div class="authwrap"><aside class="brand"><div class="logo">HR</div><h1>HR Manager <span>Pro</span></h1>
  <p>Toute la gestion RH de votre entreprise, au même endroit.</p>
  <ul><li>Employés, présences et congés</li><li>Paie adaptée à chaque pays</li><li>Recrutement et performance</li></ul></aside>
  <section class="formside"><form class="card formcard" id="f"><div class="tabs">${tabs.map(([k,l]) => `<button type="button" data-m="${k}" class="${mode===k?'on':''}">${l}</button>`).join('')}</div>
  ${su ? `<label>Nom de l’entreprise<input name="company" required minlength="2"></label>
  <label>Votre nom complet<input name="name" required></label>
  <label>Pays<select name="country"><option value="SN">Sénégal</option><option value="CI">Côte d’Ivoire</option><option value="ML">Mali</option><option value="BF">Burkina Faso</option><option value="GN">Guinée</option><option value="CM">Cameroun</option><option value="MA">Maroc</option><option value="FR">France</option></select></label>
  <label>Langue<select name="lang"><option value="fr">Français</option><option value="en">English</option><option value="ar">العربية</option><option value="de">Deutsch</option></select></label>` : ''}
  ${jn ? `<p style="color:var(--mut);font-size:14px">Utilisez le code donné par votre entreprise et l’e-mail enregistré par votre RH.</p>
  <label>Code de l’entreprise<input name="code" required maxlength="12" style="text-transform:uppercase;letter-spacing:.15em"></label>
  <label>Votre nom complet<input name="name" required></label>` : ''}
  <label>E-mail<input name="email" type="email" required autocomplete="email"></label>
  <label>Mot de passe<input name="pw" type="password" required minlength="8" autocomplete="${mode==='login' ? 'current-password' : 'new-password'}"></label>
  <button style="width:100%;margin-top:8px">${su ? 'Créer mon entreprise' : jn ? 'Rejoindre mon entreprise' : 'Se connecter'}</button>${mode === 'login' ? '<p class="link" id="fg">Mot de passe oublié ?</p>' : ''}</form></section></div>`);
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { mode = b.dataset.m; authView(); });
  if ($('#fg')) $('#fg').onclick = async () => { const em = prompt('Votre adresse e-mail :'); if (!em) return; const { error } = await sb.auth.resetPasswordForEmail(em.trim(), { redirectTo: location.href.split('#')[0] }); error ? fail(error) : toast('Si ce compte existe, un e-mail de réinitialisation vient d’être envoyé.'); };
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(e.target)), b = e.target.querySelector('button[style]'); b.disabled = true;
    const done = () => b.disabled = false, redirect = location.href.split('#')[0];
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email: f.email, password: f.pw }); done();
      return error ? fail(error) : loadMe();
    }
    let meta;
    if (su) meta = { company_name: f.company, full_name: f.name, country: f.country, language: f.lang };
    else {
      const { data:ok, error:ce } = await sb.rpc('check_join_code', { p_code: f.code, p_email: f.email });
      if (ce) { done(); return fail(ce); }
      if (!ok) { done(); return toast('Code incorrect, ou votre e-mail n’a pas été enregistré par votre RH.', true); }
      meta = { join_code: f.code.trim().toUpperCase(), full_name: f.name, language: 'fr' };
    }
    const { data, error } = await sb.auth.signUp({ email: f.email, password: f.pw, options: { emailRedirectTo: redirect, data: meta } }); done();
    if (error) return fail(error);
    if (data.session) loadMe(); else setApp(`<div class="authwrap" style="grid-template-columns:1fr"><section class="formside"><div class="card formcard"><h3>Vérifiez votre e-mail</h3><p>Un lien de confirmation a été envoyé à <b>${esc(f.email)}</b>. Ouvrez-le, puis revenez vous connecter.</p><button onclick="mode='login';authView()">Aller à la connexion</button></div></section></div>`);
  };
}

async function loadMe(){
  const { data:{ user } } = await sb.auth.getUser();
  if (!user) return authView();
  const getP = () => sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  let { data, error } = await getP(), msg = '';
  if (error) return fail(error);
  if (!data) { const r = await sb.rpc('claim_employee_profile'); if (r.error) msg = r.error.message; else ({ data } = await getP()); }
  $('#out').hidden = false;
  if (!data) { document.body.className = 'auth'; return setApp(`<div class="authwrap" style="grid-template-columns:1fr"><section class="formside"><div class="card formcard"><h3>Compte non rattaché</h3><p>${esc(msg) || 'Ce compte n’est rattaché à aucune entreprise.'}</p><button onclick="sb.auth.signOut()">Se déconnecter</button></div></section></div>`); }
  me = data; document.body.className = ''; $('#who').textContent = me.full_name || me.email; tab = 'dash'; $('#pwb').hidden = hr();
  me.role === 'super_admin' ? adminView() : hr() ? shell() : staffShell();
}

/* ---------- entreprise (RH / admin) ---------- */
const NAV = [['dash','Tableau de bord','▦'],['emp','Employés','👥'],['att','Présences','🕘'],['leave','Congés','🌴'],['pay','Paie','💳'],['rec','Recrutement','📋'],['perf','Performance','📈'],['rep','Rapports','📊'],['set','Paramètres','⚙️'],['sub','Abonnement','💎'],['sup','Support','🎧'],['me','Mon espace','👤'],['pw','Mot de passe','🔒']];
function shell(){
  document.body.className = 'hrapp';
  const ini = (me.full_name || me.email || '?').split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
  setApp(`<div class="lay" id="lay"><div class="scrim" id="scrim"></div><aside id="sb"><div class="sbl"><div class="logo sm">HR</div><b>HR Manager <span>Pro</span></b></div>
  <div class="sbn">${NAV.map(([k,l,i,s]) => `<button data-t="${k}" data-s="${s||''}"><span>${i}</span>${l}${s ? '<em>Bientôt</em>' : ''}</button>`).join('')}</div>
  <div class="plan" id="plan"></div><button class="lo" id="lo">Déconnexion</button></aside>
  <div class="mainc"><div class="top"><button class="alt bg" id="bg">☰</button><h2 id="ttl"></h2><div class="uc"><div class="avatar s">${esc(ini)}</div><div><b>${esc(me.full_name || me.email)}</b><small>${me.role === 'company_admin' ? 'Administrateur' : 'Ressources humaines'}</small></div></div></div><div id="v" class="pad"></div></div></div>`);
  const lay = $('#lay'); $('#bg').onclick = () => lay.classList.toggle('open'); $('#scrim').onclick = () => lay.classList.remove('open'); $('#lo').onclick = () => sb.auth.signOut();
  document.querySelectorAll('.sbn button').forEach(b => b.onclick = () => {
    if (b.dataset.s) return toast('Bientôt disponible : ' + b.textContent.replace('Bientôt','').trim());
    tab = b.dataset.t; lay.classList.remove('open'); show();
  });
  sb.from('subscriptions').select('status,current_period_end,plans(name,max_employees)').maybeSingle().then(({ data:s }) => {
    if (!s) return; const end = s.current_period_end ? new Date(s.current_period_end).toLocaleDateString('fr-FR') : '';
    $('#plan').innerHTML = `<b>Plan ${esc(s.plans?.name)}</b>${s.status === 'trial' ? 'Essai jusqu’au ' + end : 'Jusqu’à ' + s.plans?.max_employees + ' employés'}<button id="up">Mettre à niveau</button>`;
    $('#up').onclick = () => { tab = 'sub'; document.getElementById('lay').classList.remove('open'); show(); };
  });
  show();
}
function show(){
  document.querySelectorAll('.sbn button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#ttl').textContent = NAV.find(n => n[0] === tab)[1];
  ({ dash, emp, att, leave, pay, rec, sub, perf, rep: reports, set: settings, sup: support, me: () => myArea($('#v')), pw: () => pwForm($('#v')) })[tab]();
}
function staffShell(){ setApp('<div id="v"></div>'); myArea($('#v')); }
function chart(w){
  if (!w.length) return '<p style="color:var(--mut)">Pas encore de données.</p>';
  const vals = w.map(x => x.present + x.late), mx = Math.max(1, ...vals), n = vals.length;
  const P = vals.map((v,i) => [40 + (n === 1 ? 250 : i * 520 / (n-1)), 170 - v / mx * 130]);
  let d = `M${P[0][0]},${P[0][1]}`; for (let i = 1; i < n; i++) { const m = (P[i-1][0] + P[i][0]) / 2; d += ` C${m},${P[i-1][1]} ${m},${P[i][1]} ${P[i][0]},${P[i][1]}`; }
  return `<svg viewBox="0 0 600 210" style="width:100%"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c4f94" stop-opacity=".25"/><stop offset="1" stop-color="#1c4f94" stop-opacity="0"/></linearGradient></defs>

  const [s, l, pp, tk] = await Promise.all([sb.rpc('admin_dashboard_stats'), sb.rpc('admin_company_list'), sb.rpc('admin_pending_payments'), sb.from('support_tickets').select('id,company_id,subject,message,created_at').in('status', ['open','in_progress']).order('created_at')]);
  if (s.error) return fail(s.error); if (l.error) return fail(l.error);
  const cn = Object.fromEntries((l.data || []).map(c => [c.id, c.name])), d = s.data, k = [['companies_total','Entreprises'],['companies_active','Actives'],['companies_suspended','Suspendues'],['new_companies_30d','Nouvelles (30 j)'],['employees_total','Employés (total)'],['mrr','Revenu mensuel récurrent (FCFA)'],['revenue_month','Encaissé ce mois'],['revenue_year','Encaissé cette année'],['open_tickets','Réclamations ouvertes']];
  setApp(`<div class="grid">${k.map(([key,t]) => `<div class="kpi"><small>${t}</small><b>${fmt(d[key])}</b></div>`).join('')}</div>
  <div class="card wrap" style="margin-top:14px"><h3>Paiements à vérifier ${pp.data?.length ? '<span class="tag warn">' + pp.data.length + '</span>' : ''}</h3><table><tr><th>Date</th><th>Entreprise</th><th>Formule</th><th>Montant</th><th>Moyen</th><th>Référence</th><th></th></tr>
  ${(pp.data || []).map(x => `<tr><td>${new Date(x.created_at).toLocaleDateString('fr-FR')}</td><td>${esc(x.company_name)}</td><td>${esc(x.plan_id)}</td><td>${fmt(x.amount)} ${esc(x.currency)}</td><td>${PM[x.provider] || esc(x.provider)}</td><td><b>${esc(x.provider_ref)}</b></td>
  <td><button data-ap="${x.id}">Confirmer</button> <button class="danger" data-rj="${x.id}">Refuser</button></td></tr>`).join('') || '<tr><td colspan="7">Aucun paiement en attente.</td></tr>'}</table></div>
  <div class="card wrap" style="margin-top:14px"><h3>Réclamations ouvertes ${tk.data?.length ? '<span class="tag warn">' + tk.data.length + '</span>' : ''}</h3><table><tr><th>Date</th><th>Entreprise</th><th>Sujet</th><th>Message</th><th></th></tr>
  ${(tk.data || []).map(x => `<tr><td>${new Date(x.created_at).toLocaleDateString('fr-FR')}</td><td>${esc(cn[x.company_id])}</td><td><b>${esc(x.subject)}</b></td><td style="white-space:normal;min-width:220px">${esc(x.message)}</td><td><button data-tk="${x.id}">Répondre</button></td></tr>`).join('') || '<tr><td colspan="5">Aucune réclamation.</td></tr>'}</table></div>
  <div class="card wrap" style="margin-top:14px"><h3>Entreprises inscrites</h3><table><tr><th>Entreprise</th><th>Pays</th><th>Plan</th><th>Abonnement</th><th>Employés</th><th>Admin</th><th></th></tr>
  ${l.data.map(c => `<tr><td>${esc(c.name)}</td><td>${esc(c.country)}</td><td>${esc(c.plan_id)}</td><td><span class="tag">${SUB[c.subscription_status] || ''}</span></td><td>${c.employee_count}</td><td>${esc(c.admin_email)}</td>
  <td><button class="${c.status==='active'?'danger':'alt'}" data-id="${c.id}" data-s="${c.status==='active'?'suspended':'active'}">${c.status==='active'?'Suspendre':'Réactiver'}</button></td></tr>`).join('') || '<tr><td colspan="7">Aucune entreprise.</td></tr>'}</table></div>`);
  document.querySelectorAll('[data-id]').forEach(b => b.onclick = async () => {
    if (b.dataset.s === 'suspended' && !confirm('Suspendre cette entreprise ?')) return;
    const { error } = await sb.rpc('admin_set_company_status', { p_company: b.dataset.id, p_status: b.dataset.s });
    error ? fail(error) : (toast('Statut mis à jour'), adminView());
  });
  const act = (sel, fn, ask, msg) => document.querySelectorAll(sel).forEach(b => b.onclick = async () => { if (!confirm(ask)) return; const { error } = await sb.rpc(fn, { p_payment: b.dataset.ap || b.dataset.rj }); error ? fail(error) : (toast(msg), adminView()); });
  document.querySelectorAll('[data-tk]').forEach(b => b.onclick = async () => { const r = prompt('Votre réponse :'); if (!r) return; const { error } = await sb.rpc('admin_reply_ticket', { p_ticket: b.dataset.tk, p_status: 'resolved', p_response: r }); error ? fail(error) : (toast('Réponse envoyée'), adminView()); });
  act('[data-ap]', 'admin_approve_payment', 'Avez-vous bien reçu ce paiement sur votre compte Wave / Orange Money avec cette référence ?', 'Paiement confirmé : abonnement prolongé');
  act('[data-rj]', 'admin_reject_payment', 'Refuser ce paiement ?', 'Paiement refusé');
}
init();
</script>
</body>
</html>
